<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숫양의 계약서 — 알파</title>
<meta name="description" content="소원을 말하면 숫양이 계약서를 내민다. 질문은 세 번, 수정은 한 번.">
<meta property="og:type" content="website">
<meta property="og:title" content="숫양의 계약서">
<meta property="og:description" content="소원을 말하면 숫양이 계약서를 내민다. 질문은 세 번, 수정은 한 번.">
<!-- 공유 썸네일(SH-01, 800×400)이 준비되면 아래 주석을 풀고 주소를 넣는다. 반드시 https:// 로 시작하는 전체 주소
<meta property="og:image" content="https://아이디.github.io/저장소이름/SH-01.png">
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --room:#f5f3ed; --wall:#fbfaf6; --ink:#1c1b19; --mute:#77726a; --line:#d9d4c8;
  --paper:#fffdf7; --seal:#8b1e1e; --gold:#b8902f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#e9e6de;color:var(--ink);
  font-family:"Gowun Batang","Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif;
  word-break:keep-all;overflow-wrap:anywhere}
button,input,select{font:inherit;color:inherit}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;
  display:flex;flex-direction:column;background:var(--room);overflow:hidden}

/* 상단 바 */
#bar{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:12px;color:var(--mute)}
#bar .id{flex:1;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--line);background:var(--wall);border-radius:3px;padding:6px 10px;
  font-size:12px;min-height:32px;cursor:pointer}
.chip:disabled{opacity:.35}

/* 계약실 */
#stage{flex:1 1 0;min-height:120px;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;
  background:linear-gradient(var(--wall) 0 72%,var(--room) 72%)}
#ram{width:auto;height:min(78%,230px);aspect-ratio:26/22;image-rendering:pixelated;
  image-rendering:crisp-edges;margin-bottom:-2px;position:relative;z-index:1}
#desk{width:100%;height:26px;background:#fff;border-top:3px solid var(--ink);
  border-bottom:1px solid var(--line);position:relative;z-index:2}
#doc{position:absolute;left:50%;top:-9px;width:64px;height:20px;transform:translateX(-50%) perspective(60px) rotateX(38deg);
  background:var(--paper);border:2px solid var(--ink);
  background-image:repeating-linear-gradient(var(--paper) 0 3px,#b9b3a4 3px 4px);background-clip:content-box;padding:3px 6px}
#doc.hidden{visibility:hidden}
#doc.signed::after{content:"";position:absolute;right:5px;bottom:2px;width:8px;height:8px;border-radius:50%;background:var(--seal)}

/* 하단 패널 */
#panel{flex:0 0 auto;max-height:62%;display:flex;flex-direction:column;gap:8px;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--room)}
#say{background:var(--wall);border:2px solid var(--ink);border-radius:2px;padding:10px 12px;
  font-size:15px;line-height:1.6;min-height:76px;position:relative;cursor:pointer}
#say .who{display:block;font-size:11px;color:var(--seal);font-weight:700;letter-spacing:.1em;margin-bottom:2px}
#say .quote{display:block;margin-top:6px;padding:6px 8px;border-left:3px solid var(--seal);
  background:#fff;font-size:13.5px;line-height:1.55}
#opts{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0}
#opts>*{flex:0 0 auto}
#say{flex:0 0 auto}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--ink);border-radius:2px;
  padding:10px 12px;font-size:14.5px;line-height:1.4;min-height:44px;cursor:pointer}
.opt small{display:block;font-size:11px;color:var(--mute);letter-spacing:.06em;margin-bottom:1px}
.opt:active{background:var(--ink);color:#fff}
.opt:active small{color:#ccc}
.opt.primary{background:var(--ink);color:#fff}
.opt.ghost{border-style:dashed;color:var(--mute)}
.opt:disabled{opacity:.4;cursor:default}
.meta{font-size:11.5px;color:var(--mute);text-align:center}

/* 등록 폼 */
.form{display:grid;grid-template-columns:1fr 84px;gap:6px}
.form input,.form select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--ink);
  border-radius:2px;background:#fff;font-size:16px}
.seg{grid-column:1/-1;display:flex;gap:6px}
.seg button{flex:1;min-height:40px;border:1px solid var(--ink);background:#fff;border-radius:2px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.err{grid-column:1/-1;color:var(--seal);font-size:12px;min-height:16px}

/* 오버레이(계약서·결말·도감) */
#sheet{position:absolute;inset:0;z-index:10;background:rgba(28,27,25,.55);display:none;
  align-items:center;justify-content:center;padding:14px}
#sheet.on{display:flex}
#card{width:100%;max-height:100%;overflow-y:auto;background:var(--paper);border:2px solid var(--ink);
  border-radius:2px;padding:18px 16px 14px;box-shadow:6px 6px 0 rgba(0,0,0,.35)}
#card h2{margin:0 0 2px;font-size:19px;text-align:center;letter-spacing:.3em;text-indent:.3em}
#card .sub{text-align:center;font-size:11.5px;color:var(--mute);margin-bottom:12px}
.art{margin:0 0 10px;font-size:13.5px;line-height:1.65}
.art b{display:block;font-size:13px}
.art.amended{background:#fbeeee;outline:1px solid var(--seal);outline-offset:3px}
.art.amended b::after{content:" · 수정됨";color:var(--seal);font-weight:400}
.art.deepamend b::after{content:" · 심화 수정됨"}
.opt.deep{border-width:2px;border-color:var(--seal)}
.opt.deep small{color:var(--seal)}
.art.asked b::before{content:"✓ ";color:var(--gold)}
.sign{display:flex;justify-content:space-between;font-size:12.5px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.stamp{color:var(--seal);font-weight:700}
.row{display:flex;gap:6px;margin-top:12px}
.row .opt{text-align:center}

/* 결말 */
.serial{font-size:11.5px;letter-spacing:.14em;color:var(--mute);text-align:center}
.icon{display:block;margin:8px auto 4px;width:72px;height:72px;image-rendering:pixelated;image-rendering:crisp-edges}
.etitle{text-align:center;font-size:21px;font-weight:700;margin:2px 0}
.ewhen{text-align:center;font-size:12px;color:var(--mute);margin-bottom:10px}
.story{font-size:14.5px;line-height:1.75;margin:0 0 12px}
.fact{font-size:12.5px;line-height:1.55;border-top:1px solid var(--line);padding:7px 0 0;margin:7px 0 0}
.fact span{display:inline-block;min-width:92px;color:var(--mute)}
.new{display:inline-block;background:var(--seal);color:#fff;font-size:10.5px;padding:1px 6px;border-radius:2px;margin-left:6px;letter-spacing:.05em}

/* 도감 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.codebox{display:block;width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;word-break:break-all;background:#fff;border:1px dashed var(--ink);border-radius:2px;padding:8px;margin:4px 0 6px;-webkit-user-select:all;user-select:all}
.cell{border:1px solid var(--ink);background:#fff;padding:8px 4px;text-align:center;font-size:11px;min-height:86px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.cell canvas{width:36px;height:36px;image-rendering:pixelated;image-rendering:crisp-edges}
.cell.lock{border-style:dashed;color:var(--mute);background:transparent;cursor:default}
.cell .t{font-size:13px;font-weight:700}
.cell .lk{font-size:20px;line-height:36px;height:36px}

@keyframes pop{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
.stamp.pop{display:inline-block;animation:pop .28s ease-out}
@media (prefers-reduced-motion:reduce){.stamp.pop{animation:none}}
@media (max-height:640px){#stage{min-height:84px}#panel{max-height:74%;gap:6px}#say{min-height:56px;font-size:13.5px;padding:8px 10px;line-height:1.5}.opt{min-height:40px;padding:6px 10px;font-size:13.5px}.opt small{font-size:10.5px}#bar{padding:5px 10px}}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="id" id="cid">계약실</span>
    <button class="chip" id="btnDoc" disabled>계약서</button>
    <button class="chip" id="btnBook">결말 도감</button>
  </div>
  <div id="stage">
    <canvas id="ram" width="26" height="22" aria-label="안경을 쓴 숫양, 양 선생"></canvas>
    <div id="desk"><div id="doc" class="hidden"></div></div>
  </div>
  <div id="panel">
    <div id="say"></div>
    <div id="opts"></div>
  </div>
  <div id="sheet"><div id="card"></div></div>
</div>

<script>
/* =========================================================
   1. 콘텐츠 데이터 (추후 wish-01.json 으로 분리 가능한 구조)

const DATA = {
  version: "alpha-0.5",

    questions: 3,            // 질문 횟수

    weights: { N: 15, H: 10, A: 25, B: 25, U: 15 },
    hDeep: 20   // 심화 수정안을 고른 판에서 행복 결말(H) 가중치. 꼬리 질문에 대한 보상
  },
  wish: { id: "01", text: "평생 매달 1억 원을 받고 싶습니다." },
  /* q/a     : 첫 질문과 답변 → 기본 수정안(amend) 해금

  clauses: [

      q: "‘권종은 갑이 정한다’는 건 무슨 뜻입니까?",
      a: "지폐로 드릴지 동전으로 드릴지, 어떤 단위로 드릴지를 제가 고른다는 뜻입니다. 금액은 1원도 틀리지 않습니다. 어디에 계시든 계신 곳까지 정확히 가져다 드리지요.",
      amendLabel: "현물 대신 계좌이체로 받는다",
      amendText: "갑은 을의 생애 동안 매월 1일 0시(대한민국 표준시)에 금 1억 원을 을 명의의 예금계좌로 이체한다.",

      deepText: "을은 지급받은 금원을 그 달 말일까지 전액 소비하여야 한다. 저축·투자·증여·기부·변제는 소비로 보지 아니하며, 말일 자정까지 소비하지 아니한 금액은 을이 갑에게 그대로 반환한다." },

 [".k.....k.","kkkkkkkkk","k.......k","k.y.y.y.k","k.......k","k.y.r.y.k","k.......k","k.y.y...k","kkkkkkkkk"], // 5 달력
 [".k.k.k...","..k.k.k..",".........","kkkkkkkkk","kYYYYYYYk","kyYYYYYyk",".kyyyyyk.","..kkkkk..","...kkk..."], // 6 국수 그릇

 ["kkkkkkkkk","krrrrrrrk","kkkkkkkkk","k.r...r.k","k..r.r..k","k...r...k","k..r.r..k","k.r...r.k","kkkkkkkkk"]  // 10 달력 X

function paint(cv, rows){

/* =========================================================
   3-1. 계약서 사본 (기록 전체를 영숫자 코드로 압축, 서버 없음)
   - 구성: 버전 · 계약자번호 · 닉네임 · 나이 · 성별 · 계약횟수 · 결말 발견표 · 결말별(횟수·연수·경로) · 검사값
   - 주의: 결말은 DATA.endings 순서로 기록된다. 결말을 추가할 때는 배열 끝에만 붙일 것
   ========================================================= */
const B62 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
const COPY_BASE_URL = "";   // GitHub Pages 배포 주소를 넣으면 사본 링크가 그 주소로 만들어진다. 비우면 현재 주소
function encodeCopy(sv){
  const p = sv.profile; if (!p) return "";
  const b = [1];
  const id = String(p.id).slice(0,20); b.push(id.length); for (const ch of id) b.push(ch.charCodeAt(0) & 127);
  const nm = Array.from(new TextEncoder().encode(p.name)).slice(0,40); b.push(nm.length, ...nm);
  b.push(p.age & 255, ({"여":1,"남":2})[p.gender] || 0, (sv.plays>>8) & 255, sv.plays & 255);
  const ends = DATA.endings, mlen = Math.ceil(ends.length/8), mask = new Array(mlen).fill(0);
  ends.forEach((e,i)=>{ if (sv.found[e.id]) mask[i>>3] |= 1<<(i&7); });
  b.push(mlen, ...mask);
  ends.forEach(e=>{ const r = sv.found[e.id]; if (!r) return;
    b.push(Math.min(r.n,255), r.yrs===undefined ? 255 : (r.yrs===null ? 254 : Math.min(r.yrs,253)),
           r.via ? ((+r.via[0]-1)*2 + (r.via[1]==="b"?1:0) + 1) : 0); });
  let cs = 0; b.forEach((x,i)=>{ cs = (cs*31 + x + i) & 255; }); b.push(cs);
  let n = 0n; for (const x of b) n = n*256n + BigInt(x);
  let s = ""; while (n > 0n) { s = B62[Number(n % 62n)] + s; n /= 62n; }
  return s;
}
function decodeCopy(raw){
  let t = String(raw||""); const k = t.indexOf("copy-"); if (k >= 0) t = t.slice(k+5);
  t = t.replace(/[^0-9A-Za-z]/g, ""); if (t.length < 8) return null;
  let n = 0n; for (const ch of t) n = n*62n + BigInt(B62.indexOf(ch));
  const b = []; while (n > 0n) { b.unshift(Number(n % 256n)); n /= 256n; }
  if (b.length < 10) return null;
  const cs = b.pop(); let c = 0; b.forEach((x,i)=>{ c = (c*31 + x + i) & 255; });
  if (c !== cs || b[0] !== 1) return null;
  let i = 1; const take = ()=>{ if (i >= b.length) throw 0; return b[i++]; };
  try {
    const idl = take(); let id = ""; for (let q=0;q<idl;q++) id += String.fromCharCode(take());
    const nl = take(), nb = []; for (let q=0;q<nl;q++) nb.push(take());
    const name = new TextDecoder().decode(new Uint8Array(nb));
    const age = take(), g = take(), plays = take()*256 + take();
    const mlen = take(), mask = []; for (let q=0;q<mlen;q++) mask.push(take());
    const found = {};
    DATA.endings.forEach((e,idx)=>{
      if ((idx>>3) < mlen && (mask[idx>>3] >> (idx&7)) & 1) {
        const cnt = take(), y = take(), v = take();
        found[e.id] = { n: cnt||1, yrs: y===255 ? undefined : (y===254 ? null : y),
                        via: v ? String(((v-1)>>1)+1) + (((v-1)&1) ? "b" : "a") : null };
      }
    });
    if (i !== b.length || !name || !(age>=1 && age<=99)) return null;
    return { profile:{ name, age, gender:["-","여","남"][g]||"-", id }, found, plays };
  } catch(e){ return null; }
}
function mergeCopy(c, mode){
  if (mode==="replace" || !save.profile) save = { profile:c.profile, found:c.found, plays:c.plays, v:2 };
  else {
    Object.keys(c.found).forEach(id=>{ const a = save.found[id], r = c.found[id]; if (!a || r.n > a.n) save.found[id] = r; });
    save.plays = Math.max(save.plays, c.plays);
  }
  persist();
}

const fmtCode  = s => s.replace(/(.{5})(?=.)/g, "$1-");

/* --- 6. 결말 추첨 --- */
// 반환: 경과 연수(null=연수 없음) / -1=발생 불가
function yearsFor(e, amends, age){
  if (e.needAmend && amends.get(+e.needAmend[0]) !== e.needAmend[1]) return -1;
  if ((e.needOrig||[]).some(n=>amends.has(n))) return -1;
  if (e.after==null) return null;
  if (amends.get(2)==='a' && age + e.after >= 100) { const y = 99 - age; return y>=1 ? y : -1; }
  return e.after;
}
function amendMap(){ const m = new Map(); if (run && run.amended) m.set(run.amended.no, run.amended.lv); return m; }
function drawEnding(){
  const amends = amendMap(), age = save.profile.age, w = DATA.config.weights;
  const pool = DATA.endings.map(e=>[e, yearsFor(e, amends, age)]).filter(p=>p[1]!==-1);
  const wt = e => (e.type==="H" && run.amended && run.amended.lv==="b") ? DATA.config.hDeep : (w[e.type]||10);
  let r = Math.random()*pool.reduce((s,p)=>s+wt(p[0]),0);
  for (const p of pool){ r -= wt(p[0]); if (r < 0) return p; }
  return pool[pool.length-1];
}
function fill(t, yrs){
  const p = save.profile, y = yrs==null ? 0 : yrs;
  return t.replace(/\{name\}/g, p.name).replace(/\{yrs\}/g, y).replace(/\{days\}/g, y*12)
          .replace(/\{age\+yrs\}/g, p.age+y).replace(/\{age\+(\d+)\}/g, (_,n)=>p.age+parseInt(n,10));
}
function sceneEnding(){
  run.stage = 6; $("doc").className = "signed";
  const [e, yrs] = drawEnding(); run.ending = e.id; run.yrs = yrs;
  const isNew = !save.found[e.id];
  const rec = save.found[e.id] || { n:0 };
  rec.n++; rec.yrs = yrs; rec.via = run.amended.no + run.amended.lv;
  save.found[e.id] = rec; save.plays++; persist(); refreshBar();
  say("서명 감사합니다. 계약은 성립되었습니다. 그럼, 계약대로.", "glint");
  options([{ label:"결과를 확인한다", cls:"primary", go:()=>showEnding(e,isNew,true) }]);
  setTimeout(()=>{ if (run && run.ending===e.id && !$("sheet").classList.contains("on")) showEnding(e,isNew,true); }, 1700);
}

$("sheet").onclick = ev=>{ if (ev.target.id==="sheet" && !(run && run.stage===6 && $("card").dataset.lock==="1")) closeSheet(); };

function showContract(){
  $("card").dataset.lock = "";
  const p = save.profile, signed = run && run.stage>=6;
  let h = '<h2>계약서</h2><div class="sub">소원: '+esc(DATA.wish.text)+'<br>갑 양 선생 · 을 '+esc(p.name)+' ('+esc(p.id)+')</div>';
  DATA.clauses.forEach(c=>{
    const cls = (run.amended&&run.amended.no===c.no?" amended"+(run.amended.lv==='b'?" deepamend":""):"")+(askedN(c.no)?" asked":"");
    h += '<p class="art'+cls+'"><b>제'+c.no+'조('+c.title+')</b>'+esc(clauseText(c))+'</p>';
  });
  h += '<div class="sign"><span>갑 <span class="stamp">양 ㊞</span></span><span>을 '+(signed?'<span class="stamp">'+esc(p.name)+' ㊞</span>':'(서명 전)')+'</span></div>';
  h += '<div class="row"><button class="opt primary" id="xClose">덮는다</button></div>';
  openSheet(h); $("xClose").onclick = closeSheet;
}

function showEnding(e, isNew, live){
  $("card").dataset.lock = live ? "1" : "";
  const rec = save.found[e.id];
  const yrs = live && run && run.ending===e.id ? run.yrs : (rec && rec.yrs!==undefined ? rec.yrs : e.after);
  const when = yrs!=null ? "계약 "+yrs+"년 후" : "만 100세가 되는 날";
  let h = '<div class="serial">결말 '+esc(e.serial)+(isNew?'<span class="new">NEW</span>':'')+'</div>'+
    '<canvas class="icon" id="eIcon"></canvas>'+
    '<div class="etitle">'+esc(e.title)+'</div><div class="ewhen">'+when+'</div>'+
    '<p class="story">'+esc(fill(e.story,yrs))+'</p>'+
    '<div class="fact"><span>계약 이행 결과</span>'+esc(fill(e.result,yrs))+'</div>'+
    '<div class="fact"><span>관련 조항</span>'+esc(e.basis)+'</div>'+
    (!live && rec && rec.via ? '<div class="fact"><span>최근 도달 경로</span>제'+rec.via[0]+'조 '+(rec.via[1]==="b"?"심화 수정":"수정")+' · '+rec.n+'회</div>' : '');
  if (live) {
    const total = DATA.endings.length, got = DATA.endings.filter(x=>save.found[x.id]).length;
    h += '<div class="fact"><span>수집</span>'+got+' / '+total+' · <span class="stamp pop" style="min-width:0;color:var(--seal)">계약 이행 완료 ㊞</span></div>'+
      ((save.plays===1 || !storageOK) ? '<div class="meta" style="margin-top:8px">‘도감 → 계약서 사본 받기’로 기록을 보관해 두면 다른 기기에서도 이어집니다.</div>' : '')+
      '<div class="row"><button class="opt" id="xBook">도감</button><button class="opt primary" id="xAgain">다시 계약한다</button></div>';
  } else h += '<div class="row"><button class="opt primary" id="xBack">도감으로</button></div>';
  openSheet(h); paint($("eIcon"), ICONS[e.icon]);
  if (live) { $("xAgain").onclick = ()=>{ closeSheet(); start(); }; $("xBook").onclick = ()=>showBook(e); }
  else $("xBack").onclick = ()=>showBook(live===false ? null : null, true);
}

let bookReturn = null, wipeArmed = false;
function showBook(returnTo, keep){
  if (!keep) bookReturn = returnTo||null;
  $("card").dataset.lock = bookReturn ? "1" : "";
  wipeArmed = false;
  const total = DATA.endings.length, got = DATA.endings.filter(x=>save.found[x.id]).length;
  let h = '<h2>결말 도감</h2><div class="sub">소원 01 · 발견 '+got+' / '+total+' · 계약 '+save.plays+'회</div><div class="grid">';
  DATA.endings.forEach((e,i)=>{
    h += save.found[e.id]
      ? '<div class="cell" data-i="'+i+'"><canvas data-ic="'+e.icon+'"></canvas><div class="t">'+esc(e.title)+'</div><div>'+esc(e.serial)+' ×'+save.found[e.id].n+'</div></div>'
      : '<div class="cell lock"><div class="lk">?</div><div class="t">잠김</div><div>'+esc(e.serial)+'</div></div>';
  });
  h += '</div>'+(storageOK ? '' : '<div class="meta" style="color:var(--seal);margin-top:8px">이 브라우저는 기록을 저장하지 못합니다. 창을 닫기 전에 계약서 사본을 받아 두십시오.</div>')+
    (save.profile ? '<div class="row"><button class="opt" id="xCopy">계약서 사본 받기</button></div>' : '')+
    '<div class="row"><button class="opt ghost" id="xWipe">기록 초기화</button><button class="opt primary" id="xClose">'+(bookReturn?"결말로 돌아간다":"닫는다")+'</button></div>';
  openSheet(h);
  document.querySelectorAll("#card canvas[data-ic]").forEach(cv=>paint(cv, ICONS[+cv.dataset.ic]));
  document.querySelectorAll("#card .cell[data-i]").forEach(el=>el.onclick=()=>{
    if (!save.profile) return; showEnding(DATA.endings[+el.dataset.i], false, false); });
  $("xClose").onclick = ()=>{ if (bookReturn) showEnding(bookReturn,false,true); else closeSheet(); };
  if ($("xCopy")) $("xCopy").onclick = showCopy;
  $("xWipe").onclick = ()=>{
    if (!wipeArmed) { wipeArmed = true; $("xWipe").textContent = "한 번 더 누르면 삭제"; return; }
    save = { profile:null, found:{}, plays:0 }; persist(); bookReturn=null; closeSheet(); start();
  };
}
function showCopy(){
  const code = encodeCopy(save), link = copyLink(code);
  let h = '<h2>계약서 사본</h2><div class="sub">'+esc(save.profile.name)+' · '+esc(save.profile.id)+' · 발견 '+foundCount(save)+' / '+DATA.endings.length+'</div>'+
    '<p class="art">이 사본이 있으면 기록이 지워졌거나 다른 브라우저·휴대폰에서 열어도 이어서 계약할 수 있습니다. 링크를 카카오톡 ‘나와의 채팅’에 붙여 두십시오. 첫 화면에서 ‘이미 계약해 본 적이 있습니다’를 누르고 번호를 넣어도 됩니다.</p>'+
    '<div class="fact"><span>사본 번호</span></div><div class="codebox" id="cCode">'+esc(fmtCode(code))+'</div>'+
    '<div class="fact"><span>사본 링크</span></div><input class="codebox" id="cLink" readonly value="'+esc(link)+'">'+
    '<div class="meta" id="cMsg">새 결말을 발견하면 사본을 다시 받아야 반영됩니다.</div>'+
    '<div class="row"><button class="opt" id="xCopyNo">번호 복사</button><button class="opt primary" id="xCopyLink">링크 복사</button></div>'+
    '<div class="row"><button class="opt ghost" id="xCopyBack">도감으로</button></div>';
  openSheet(h);
  const cp = (txt, el)=>{
    const ok = ()=>{ $("cMsg").textContent = "복사했습니다. 카카오톡 ‘나와의 채팅’에 붙여 넣으십시오."; };
    const fb = ()=>{
      try { if (el.select) el.select(); else { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } } catch(e){}
      $("cMsg").textContent = "자동 복사가 막혀 있습니다. 선택된 글자를 길게 눌러 복사해 주십시오.";
    };
    try { navigator.clipboard.writeText(txt).then(ok, fb); } catch(e){ fb(); }
  };
  $("xCopyNo").onclick = ()=>cp(fmtCode(code), $("cCode"));
  $("xCopyLink").onclick = ()=>cp(link, $("cLink"));
  $("xCopyBack").onclick = ()=>showBook(null, true);
}
$("btnBook").onclick = ()=>showBook(run && run.stage===6 ? DATA.endings.find(e=>e.id===run.ending) : null);
$("btnDoc").onclick = ()=>{ if (run && run.stage>=2 && save.profile) showContract(); };

setFace("neutral");
(function boot(){
  let h = ""; try { h = decodeURIComponent(location.hash || ""); } catch(e){}
  if (h.indexOf("copy-") >= 0) {
    const c = decodeCopy(h);
    try { history.replaceState(null, "", location.href.split("#")[0]); } catch(e){ try { location.hash = ""; } catch(_){} }
    if (c) { run = { stage:0, asked:{}, used:0, amended:null }; return applyCopy(c); }
  }
  start();
})();
</script>
</body>
</html>
